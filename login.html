<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso privado — Vértice</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1729;font:15px system-ui,sans-serif;color:#fff;padding:20px}.card{width:min(100%,440px);background:#fff;color:#17243b;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0006}.mark{font-weight:900;font-size:25px;letter-spacing:-1px;color:#182b48}.mark span{color:#2599d2}.tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#3477ff;font-weight:800;margin-top:28px}h1{font-size:25px;margin:8px 0}p{font-size:13px;line-height:1.6;color:#6a7890}label{display:block;font-weight:750;font-size:12px;margin:19px 0 7px}input{width:100%;padding:14px;border:1px solid #dce4ee;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:14px;background:#1e5fe9;color:#fff;font-weight:800;margin-top:13px;cursor:pointer}.status{font-size:12px;color:#b34b40;min-height:20px;margin-top:12px}.back{display:inline-block;margin-top:18px;color:#2861ce;text-decoration:none;font-size:12px}</style></head><body><main class="card"><div class="mark">VÉRTICE<span>.</span></div><div class="tag">Área privada</div><h1>Central administrativa</h1><p>Entre com sua chave privada. A credencial será validada no servidor e trocada por uma sessão protegida; ela não ficará salva no navegador.</p><form id="login"><label for="token">Chave de administrador</label><input id="token" type="password" autocomplete="current-password" required maxlength="300"><button type="submit">Entrar com segurança</button><div class="status" id="status" role="status"></div></form><a class="back" href="/">← Voltar ao portal</a></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const field=document.getElementById('token');const status=document.getElementById('status');const token=field.value;field.value='';status.textContent='Validando…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível entrar.');location.replace('/admin');}catch(err){status.textContent=err.message;}});</script></body></html>
